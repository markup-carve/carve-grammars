name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # GATE: the notes are not the workflow's to write. A CHANGELOG entry is
      # deliberately one or two lines for a contributor, which makes poor
      # release notes for a reader deciding whether to upgrade. A human writes
      # the draft first and this refuses to publish without one.
      #
      # Found by listing rather than `gh release view <tag>`: a draft's tag is
      # not a git ref, so addressing one by tag can match nothing, change
      # nothing and still exit 0.
      - name: A release draft for this tag exists and has notes
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release="$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq "[.[] | select(.tag_name == \"$GITHUB_REF_NAME\")] | first")"
          if [ -z "$release" ]; then
            echo "::error::no release for $GITHUB_REF_NAME. Write the notes first:" \
                 "gh release create $GITHUB_REF_NAME --draft --notes-file NOTES.md"
            exit 1
          fi
          body="$(printf '%s' "$release" | jq -r '.body // ""' | tr -d '[:space:]')"
          [ -n "$body" ] \
            || { echo "::error::the release for $GITHUB_REF_NAME has no notes"; exit 1; }
          printf '%s' "$release" | jq -r '"draft=\(.draft) tag=\(.tag_name)"'

      - uses: actions/checkout@v4
        with:
          submodules: recursive # spec corpus submodule; npm test needs it

      - name: Verify version and changelog match the tag
        run: |
          VER_EXPECT="${GITHUB_REF_NAME#v}"
          VER="$(node -p "require('./package.json').version")"
          if [ "$VER_EXPECT" != "$VER" ]; then
            echo "::error::Release tag ${GITHUB_REF_NAME} does not match package.json version $VER."
            exit 1
          fi
          if ! grep -qE "^## \[?${VER_EXPECT//./\\.}\]?" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for $VER_EXPECT."
            exit 1
          fi

      # A git dependency ships to every consumer: npm skips its integrity
      # check, the install needs git and GitHub reachability (and resolves over
      # SSH wherever an insteadOf rewrite is configured), and a commit pin stops
      # tracking the engine's releases. 0.1.4 shipped with the engine pinned to
      # a carve-js commit for exactly this reason and nothing noticed, because
      # the manifest was never inspected before publishing.
      #
      # The rule lives in a script rather than inline here so that its own
      # behavior is testable: `tests/no-git-dependencies-test.js` runs it over
      # the acceptance matrix on every pull request. Inline, it only ever ran on
      # a tag push, which is the worst moment to learn the guard is wrong.
      - name: No dependency is installed over git
        run: node scripts/no-git-dependencies.mjs

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci
      - run: npm test

      - name: Publish to npm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
