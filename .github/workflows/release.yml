name: Release packages and assets

# THE TAG IS CREATED BY THIS WORKFLOW, AFTER THE GATES PASS AND AFTER A HUMAN
# APPROVES. It used to be the trigger, and that ordering is what broke v0.1.12.
#
# Packagist is pull-based: it reads this repository's tags and serves the new
# stable version within minutes, with no approval anywhere in the path. So on a
# tag-triggered workflow the gates ran AFTER the only irreversible act in the
# release. v0.1.12 was tagged, Packagist served it inside two minutes, and the
# gates then refused the tag because four merged fixes were cited nowhere, which
# skipped the npm publish. The result could not be corrected: a published
# version's source reference on Packagist is immutable, so 0.1.12 lived on one
# registry and never reached the other, and 0.1.13 had to supersede identical
# code. The same shape cost v0.1.10 a withdrawal on 2026-09-30.
#
# Inverted here. `workflow_dispatch` runs the gates against `main`, the approval
# sits between them and the tag, and the tag is created only after both. Nothing
# reaches a registry until a human has looked at a passing gate.
#
# The publish runs in THIS run rather than on the new tag, because a ref created
# with `github.token` does not trigger other workflows. A tag-triggered publish
# job would simply never fire.
#
# Every job declares timeout-minutes so a hung step fails in minutes rather than
# inheriting the 360-minute GitHub default.

on:
  workflow_call:
    inputs:
      publish:
        required: true
        type: boolean
      tag:
        required: true
        type: string
      version:
        required: true
        type: string
      release_tag:
        required: true
        type: string
      source_sha:
        required: true
        type: string
      release_id:
        required: true
        type: string
      release_body:
        required: true
        type: string
      notes_digest:
        required: true
        type: string
jobs:
  guard:
    name: The manifests and the changelog agree
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # The completeness gate walks every merge back to the previous tag, so
          # it needs the tags and the history behind them.
          fetch-depth: 0

      # Before anything else: refuse a version that already exists. On a
      # tag-triggered workflow this was impossible by construction; now it is the
      # first thing that can go wrong, and the failure mode it guards against is
      # the expensive one.
          ref: ${{ inputs.source_sha }}
      - name: Expose the candidate tag locally
        if: ${{ !inputs.publish }}
        shell: bash
        env:
          CANDIDATE_TAG: ${{ inputs.tag }}
        run: |
          git tag "$CANDIDATE_TAG" "${{ inputs.source_sha }}"
      - name: package.json declares this version
        run: |
          VER="${{ inputs.version }}"
          GOT="$(node -p "require('./package.json').version")"
          if [ "$VER" != "$GOT" ]; then
            echo "::error::package.json declares $GOT, but this run would release $VER."
            exit 1
          fi

      - name: The changelog describes this version
        run: |
          VER="${{ inputs.version }}"
          if ! grep -qE "^## \[?${VER//./\\.}\]?" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for $VER."
            exit 1
          fi

      # ...and it describes ALL of it. The step above only asks whether a section
      # EXISTS, and a section exists from the moment `chore: cut X.Y.Z` writes it;
      # development then carries on over it and nobody reopens it. This step names
      # every missing pull request at once, and
      # `tests/changelog-completeness-test.js` runs its logic on every pull
      # request so a release is not where a broken gate is discovered.
      - name: The changelog section accounts for every merge in this release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/changelog-completeness.mjs "v${{ inputs.version }}"

      # A git dependency ships to every consumer: npm skips its integrity check,
      # the install needs git and GitHub reachability, and a commit pin stops
      # tracking the engine's releases. 0.1.4 shipped with the engine pinned to a
      # carve-js commit for exactly this reason and nothing noticed, because the
      # manifest was never inspected before publishing.
      - name: No dependency is installed over git
        run: node scripts/no-git-dependencies.mjs

  release-notes:
    name: A release draft for this version exists and describes every merge
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # `write`, not `read`: a DRAFT release is invisible to a caller without push
      # access, so under `contents: read` the listing comes back empty and the gate
      # reports "no release" for a draft sitting right there with notes in it.
      # See markup-carve/carve-wasm#80.
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # GATE: the notes are not the workflow's to write. A CHANGELOG entry is
      # deliberately one or two lines for a contributor, which makes poor release
      # notes for a reader deciding whether to upgrade. A human writes the draft
      # first and this refuses to release without one.
      #
      # Found by listing rather than `gh release view <tag>`: a draft's tag is not
      # a git ref, so addressing one by tag can match nothing, change nothing and
      # still exit 0.
          ref: ${{ inputs.source_sha }}
      - name: Expose the candidate tag locally
        if: ${{ !inputs.publish }}
        shell: bash
        env:
          CANDIDATE_TAG: ${{ inputs.tag }}
        run: |
          git tag "$CANDIDATE_TAG" "${{ inputs.source_sha }}"
      - name: The draft exists and has notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release="$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq "[.[] | select(.tag_name == \"v${{ inputs.version }}\")] | first")"
          if [ -z "$release" ]; then
            echo "::error::no draft release for v${{ inputs.version }}. Write the notes first."
            echo "::error::if a draft DOES exist, this job could not see it -" \
                 "check that the job still declares contents: write"
            exit 1
          fi
          printf '%s' "$release" | jq -r '.body // ""' > /tmp/release-notes.md
          printf '%s' "$release" | jq -r '"draft=\(.draft) tag=\(.tag_name)"'

      # ...and they describe ALL of it. A non-emptiness test cannot see a draft
      # that went stale: the 0.1.10 draft was written on 2026-09-26 at 00:47, #569
      # added its breaking entry at 11:19 the same day, and the draft still had no
      # Breaking section at all when the tag was pushed. So the notes are held to
      # the same bar as the changelog section, over the same range of merges.
      - name: The notes account for every merge in this release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/changelog-completeness.mjs "v${{ inputs.version }}" --body-file /tmp/release-notes.md

  npm-credential:
    name: The npm credential can publish this package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
      - name: Expose the candidate tag locally
        if: ${{ !inputs.publish }}
        shell: bash
        env:
          CANDIDATE_TAG: ${{ inputs.tag }}
        run: |
          git tag "$CANDIDATE_TAG" "${{ inputs.source_sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # GATE, joined to the tag job's `needs:`. This workflow creates the tag
      # itself, so the tag is the first irreversible act and the gate has to sit
      # before it. A separate job rather than a step: a gate as a step gets
      # skipped while the job still reports green, which is the shape that
      # shipped a vulnerable carve-py in this organization.
      #
      # WHY IT EXISTS. carve-grammars v0.1.13, 2026-10-08: every gate passed,
      # the release was approved, the tag was created, Packagist served it
      # within two minutes, and then `npm publish` answered
      # "404 Not Found - PUT" on the package URL. npm answers 404 rather than
      # 403 for a scoped package so it does not leak existence, so that is an
      # authorization failure and not a missing package: 0.1.11 was serving at
      # the time. The result was 0.1.13 on Packagist and 0.1.11 on npm.
      # A credential is checkable without publishing anything, and it was the
      # one precondition no gate checked.
      #
      # Nothing below publishes, changes or deprecates anything.
      - name: The token is live and can write this package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -uo pipefail

          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::NPM_TOKEN is not readable from this repository, so the publish cannot authenticate at all."
            exit 1
          fi

          # FATAL. An expired, revoked or malformed token fails here with
          # 401 / ENEEDAUTH, and this is the one probe below whose failure is
          # unambiguous.
          if ! who="$(npm whoami 2>&1)"; then
            echo "::error::npm rejected the credential: ${who}"
            echo "::error::rotate NPM_TOKEN before releasing. A 404 on PUT is an auth failure, not a missing package."
            exit 1
          fi
          echo "authenticated as ${who}"

          pkg="$(node -p "require('./package.json').name")"
          echo "package under release: ${pkg}"

          # REPORTED, NOT FATAL, and measured rather than assumed. This is the
          # organization endpoint /-/org/<scope>/package, an org read and not a
          # package write. On carve-wasm run 32156381782 this organization's
          # NPM_TOKEN answered 403 "You may not perform that action with these
          # credentials" here, while an anonymous GET of the same URL returned
          # the whole scope. A credential with fewer rights than a stranger on
          # an org endpoint is the signature of a granular access token, which
          # says nothing about whether it can publish. Made fatal, as the first
          # draft of this gate had it, this would refuse every release in this
          # organization.
          echo "== packages this credential can see in the scope"
          if ! npm access list packages 2>&1; then
            echo "  REFUSED on the org endpoint. An anonymous reader is not refused here, so this"
            echo "  is about the credential's kind, not about the scope being unreachable."
          fi

          # The discriminator, and the reason the two probes above are not
          # enough. A classic automation token can read this endpoint and a
          # granular one cannot. A classic token carries its owner's publish
          # rights, so with a read-write grant below the publish is as proven
          # as it gets without publishing. A granular token's package grants
          # are fixed when it is created and are not readable from here at all,
          # which is the residual risk this gate cannot close.
          echo "== the kind of credential"
          if npm token list >/dev/null 2>&1; then
            echo "  classic automation token: it carries the owner's publish rights."
          else
            echo "  granular access token: its package grants are fixed at creation and cannot be"
            echo "  read from here. If this package is not among them the publish fails with E404"
            echo "  and no change in this repository can fix it. Check the token at npmjs.com."
          fi

          # FATAL ONLY ON A DEFINITE NEGATIVE. Note what this is and is not:
          # the collaborators endpoint is a PUBLIC read, so it reports the npm
          # USER's grant on the package and not the token's. A read-only grant
          # therefore means the publish cannot succeed whatever the token is,
          # which is worth stopping for; read-write does not prove the token
          # inherits it, which is why it is not reported as a pass.
          echo "== the account's grant on the package"
          if grants="$(npm access list collaborators "${pkg}" --json 2>/dev/null)"; then
            mine="$(printf '%s' "${grants}" | jq -r --arg u "${who}" '.[$u] // "not listed"')"
            echo "  ${who}: ${mine}"
            if [ "${mine}" = "read-only" ]; then
              echo "::error::${who} holds read-only access to ${pkg}, so the publish cannot succeed."
              echo "::error::grant write access or rotate NPM_TOKEN before releasing."
              exit 1
            fi
          else
            echo "  the endpoint did not answer, which does not distinguish 'no permission' from"
            echo "  'no such package', so it is not treated as a verdict."
          fi
  tag:
    name: Create the tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [guard, release-notes, npm-credential]
    # THE APPROVAL GATE. `needs:` makes this unreachable until both gate jobs
    # pass, and the environment holds it until a required reviewer approves, so
    # whoever approves is looking at a green gate rather than at nothing. This is
    # the only place a human decision belongs in a release.
    environment: release
    permissions:
      contents: write
      actions: read
    outputs:
      sha: ${{ inputs.source_sha }}
    steps:
      - uses: actions/checkout@v4

        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
      - name: Expose the candidate tag locally
        if: ${{ !inputs.publish }}
        shell: bash
        env:
          CANDIDATE_TAG: ${{ inputs.tag }}
        run: |
          git tag "$CANDIDATE_TAG" "${{ inputs.source_sha }}"
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [tag]
    # NO `environment:` here. GitHub asks for an approval once per gated JOB, so
    # declaring the environment on both tag and publish asked twice for one
    # decision - measured on run 37767870312, where the second prompt arrived
    # after the tag already existed and so could not withhold anything. The
    # approval belongs on the first irreversible step, and `needs: [tag]` already
    # makes this unreachable without it.
    permissions:
      contents: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          submodules: recursive # spec corpus submodule; npm test needs it

          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify approval and checked tag before publishing
        working-directory: ${{ github.workspace }}
        if: ${{ inputs.publish }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_SHA: ${{ inputs.source_sha }}
          RELEASE_NOTES_DIGEST: ${{ inputs.notes_digest }}
        run: python .github/scripts/release-lane.py permit
      - name: Expose the candidate tag locally
        if: ${{ !inputs.publish }}
        shell: bash
        env:
          CANDIDATE_TAG: ${{ inputs.tag }}
        run: |
          git tag "$CANDIDATE_TAG" "${{ inputs.source_sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci
      - run: npm test

      - name: Publish to npm
        run: |
          if [ "$LANE_PUBLISH" = true ]; then
            npm publish --access public --provenance
          else
            npm publish --dry-run --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # A registry publish is not finished until the release page exists. Doing it
      # here rather than by hand also means the draft stops being a thing someone
      # has to remember to publish at the right moment.
      #
      # Last, deliberately: a draft that stays a draft is recoverable, and one
      # published beside a failed publish is not.
        shell: bash
permissions:
  contents: write
  actions: read
  id-token: write
env:
  LANE_TAG: ${{ inputs.tag }}
  LANE_REF: ${{ format('refs/tags/{0}', inputs.tag) }}
  LANE_REF_TYPE: tag
  LANE_PUBLISH: ${{ inputs.publish }}
