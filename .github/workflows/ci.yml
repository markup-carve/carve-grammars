name: CI

on:
  push:
    branches: [main, next2]
  pull_request:

jobs:
  grammars:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run syntax-palette:check
      - run: npm test
      - run: npm pack --dry-run
