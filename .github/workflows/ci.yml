name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  grammars:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          # The Tiptap kit test reads the 0.2 conformance corpus from the spec submodule.
          submodules: true
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run syntax-palette:check
      - run: npm test
      - run: npm pack --dry-run
