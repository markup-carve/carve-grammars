name: Unpublish version (manual)
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to unpublish
        required: true
jobs:
  unpublish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm unpublish "carve-grammars@${{ inputs.version }}" --force
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
