name: Engine drift

# `@markup-carve/carve` is a PUBLISHED dependency, and this repo builds against
# whatever version the lockfile resolves - but nothing notices when that version
# falls behind, and a push-only CI reports the state of the day someone last
# touched the repo.
#
# The exposure here is larger than "a highlighter uses a parser". The round-trip
# test parses through the engine, and the coverage matrix's covered/skip
# decisions were measured empirically against one specific build, so the engine
# decides what a green tick means. `spec-drift.yml` already watches the corpus
# for exactly that reason; this is its other half.
#
# The rule lives in `scripts/engine-drift.mjs`, not in this file, and
# `tests/engine-drift-test.js` runs it on every pull request. Both of those are
# a correction: this job used to carry its own rule requiring a 40-hex git
# revision, which `scripts/no-git-dependencies.mjs` and its 65 test rows exist
# to reject. Two guards in one repo asserted opposite things, only the nightly
# one could fail, and it did - every night, for something no correct manifest
# could satisfy.

on:
  schedule:
    # 05:00 UTC daily, alongside the spec-drift run.
    - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  engine-pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out the engine
        uses: actions/checkout@v4
        with:
          repository: markup-carve/carve-js
          path: carve-js
          fetch-depth: 0

      - name: Compare the released engine against carve-js main
        run: node scripts/engine-drift.mjs carve-js
